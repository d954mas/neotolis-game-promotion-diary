    .detail-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .detail-thumb .play {
      position: absolute; right: 8px; bottom: 8px;
      padding: 3px 8px;
      background: rgba(0,0,0,.7);
      color: #fff; font-family: var(--f-mono); font-size: 11.5px;
      border-radius: var(--r-xs);
    }
    .detail-thumb.empty {
      background: radial-gradient(circle at 50% 50%, var(--surface-2) 0%, var(--surface) 70%);
    }

    /* URL row — appears under the title, always visible. Mono font,
     * truncated with ellipsis if long. Open button (↗) sits to the
     * right. For freeform kinds (everything except platform-bound ones)
     * clicking the URL text enters edit mode. */
    .detail-url {
      display: flex; align-items: center; gap: 8px;
      min-width: 0;
    }
    .detail-url-text {
      flex: 1; min-width: 0;
      padding: 4px 8px;
      margin-left: -8px;
      background: transparent;
      border: 0;
      text-align: left;
      font-family: var(--f-mono);
      font-size: 12px;
      color: var(--text-2);
      text-decoration: underline;
      text-underline-offset: 2px;
      text-decoration-color: color-mix(in oklab, var(--text-3) 50%, transparent);
      text-overflow: ellipsis; overflow: hidden; white-space: nowrap;
      border-radius: var(--r-sm);
      transition: background var(--m-fast) var(--m-ease),
                  color var(--m-fast) var(--m-ease),
                  text-decoration-color var(--m-fast) var(--m-ease);
    }
    .detail-url-text:hover {
      color: var(--text);
      text-decoration-color: var(--text-2);
      background: var(--surface-2);
    }
    .detail-url-empty {
      color: var(--text-4);
      font-style: italic;
      font-family: var(--f-sans);
      font-size: var(--t-13);
      text-decoration: none;
      cursor: pointer;
    }
    .detail-url-empty:hover {
      color: var(--text-2);
      text-decoration: none;
    }
    /* Pencil edit affordance — sits between URL text and ↗. Subtle by
     * default, brightens on hover. Touch-friendly target size. */
    .detail-url-edit {
      width: 28px; height: 28px;
      display: inline-flex; align-items: center; justify-content: center;
      background: transparent;
      border: 1px solid transparent;
      border-radius: var(--r-sm);
      color: var(--text-3);
      cursor: pointer;
      flex-shrink: 0;
      transition: background var(--m-fast), border-color var(--m-fast), color var(--m-fast);
    }
    .detail-url-edit:hover {
      background: var(--surface-2);
      border-color: var(--border);
      color: var(--text);
    }
    .detail-url-open {
      width: 28px; height: 28px;
      display: inline-flex; align-items: center; justify-content: center;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--r-sm);
      color: var(--text-2);
      text-decoration: none;
      font-size: 14px;
      flex-shrink: 0;
      transition: background var(--m-fast), border-color var(--m-fast), color var(--m-fast);
    }
    .detail-url-open:hover {
      background: var(--surface-3);
      border-color: var(--accent);
      color: var(--text);
    }
    .detail-url-input {
      width: calc(100% + 16px) !important;
      margin-left: -8px;
      padding: 4px 8px !important;
      background: var(--surface-2);
      border: 1px solid var(--accent) !important;
      border-radius: var(--r-sm);
      color: var(--text);
      font-family: var(--f-mono);
      font-size: 12px;
      outline: none;
      box-shadow: 0 0 0 3px var(--accent-soft);
      min-height: 32px;
    }
    .detail-notes {
      margin: 0;
      color: var(--text);
      font-size: var(--t-14);
      line-height: 1.55;
      white-space: pre-wrap;
    }
    .detail-notes-empty {
      color: var(--text-3);
      font-style: italic;
    }

    /* Stats — denser than card stats; show label + value pairs. */
    .detail-stats {
      display: flex; flex-wrap: wrap; gap: 14px;
      padding: 10px 12px;
      background: var(--surface-2);
      border: 1px solid var(--border-hairline);
      border-radius: var(--r-sm);
    }
    .detail-stat {
      display: inline-flex; align-items: center; gap: 6px;
      color: var(--text-3);
      font-size: var(--t-12);
    }
    .detail-stat svg { width: 13px; height: 13px; color: var(--text-3); }
    .detail-stat b {
      color: var(--text);
      font-weight: var(--w-sb);
      font-variant-numeric: tabular-nums;
      font-size: var(--t-13);
    }
    .detail-stat-text {
      font-family: var(--f-mono);
      color: var(--text-2);
    }

    /* Section block — labelled groups (Games / Add a note). */
    .detail-section {
      display: flex; flex-direction: column; gap: 8px;
      padding-top: 6px;
    }
    .detail-section-label {
      font-size: 10.5px;
      font-weight: var(--w-sb);
      color: var(--text-3);
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }
    .detail-game-row {
      display: flex; flex-wrap: wrap; gap: 6px;
      align-items: center;
    }

    .detail-note-input {
      min-height: 64px;
      font-family: var(--f-sans);
    }
    .detail-note-actions {
      display: flex; align-items: center; gap: 10px;
    }
    .detail-note-actions .btn { flex-shrink: 0; }
    .detail-note-hint {
      color: var(--text-4);
      font-size: 11.5px;
      line-height: 1.4;
    }

    /* Mobile — panel takes full width minus a small margin; modal takes
     * full screen. */
    @media (max-width: 640px) {
      .detail-panel {
        width: 100vw;
        border-left: 0;
        box-shadow: none;
      }
      .detail-modal {
        width: calc(100vw - 12px);
        max-height: calc(100vh - 12px);
      }
      .detail-body { padding: 14px 16px 18px; }
    }

    /* ── Sources page ──────────────────────────────────────────
     * Rows-as-cards: single-column rows that share feed-card surface
     * vocabulary (border, radius, color-stripe). Grouped by platform
     * so the user can quickly scan "I have 2 YouTube + 2 Reddit". */
    .sources-list {
      display: flex; flex-direction: column;
      gap: var(--s-7);
      padding-bottom: var(--s-6);
    }
    .sources-group { display: flex; flex-direction: column; }
    .sources-group-head {
      display: flex; align-items: center; gap: var(--s-2);
      padding: var(--s-3) 0;
    }
    .sources-group-title {
      margin: 0;
      font-size: var(--t-13);
      font-weight: var(--w-sb);
      color: var(--text-2);
      letter-spacing: 0.01em;
    }
    .sources-group-count {
      font-family: var(--f-mono);
      font-size: var(--t-12);
      color: var(--text-3);
      padding: 0 6px;
      background: var(--surface-2);
      border-radius: var(--r-pill);
    }
    .sources-group-rule { flex: 1; height: 1px; background: var(--border-hairline); }
    .sources-rows {
      display: flex; flex-direction: column;
      gap: var(--s-2);
    }

    /* ⋯ overflow on source rows — quieter than feed-card's lifted
     * button: no surface, no border, just a dim glyph that hides into
     * the row's calm state. Hover reveals a subtle surface. */
    .source-row .card-actions {
      position: absolute;
      top: 10px; right: 10px;
    }
    .source-row .card-action-btn.overflow {
      background: transparent;
      border: 0;
      color: var(--text-4);
      box-shadow: none;
      width: 24px; height: 24px;
    }
    .source-row .card-action-btn.overflow:hover {
      background: var(--surface-2);
      color: var(--text-2);
      border: 0;
    }

    .source-row {
      position: relative;
      display: grid;
      grid-template-columns: 1fr auto;
      grid-template-areas:
        "title acts"
        "foot  foot";
      align-items: center;
      gap: 6px 12px;
      padding: 12px 14px 10px;
      padding-right: 44px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-md);
      box-shadow: var(--shadow-card);
      transition: background var(--m-fast) var(--m-ease),
                  border-color var(--m-fast) var(--m-ease),
                  opacity var(--m-fast) var(--m-ease);
    }
    .source-title { grid-area: title; }
    .source-actions { grid-area: acts; justify-content: flex-end; }
    .source-foot { grid-area: foot; }

    /* Title row — mini kind icon + handle, on a single line with the
     * action cluster on the right. The big kind tile is gone (the
     * section header above already carries the platform). Mini icon
     * stays so the title has a stable left anchor and the platform is
     * still readable if a user collapses the section. */
    .source-title {
      display: flex; align-items: center;
      gap: 8px;
      margin: 0;
      min-width: 0;
      font-family: var(--f-mono);
      font-size: var(--t-15);
      font-weight: var(--w-sb);
      color: var(--text);
      letter-spacing: -0.005em;
      line-height: 1.25;
    }
    .source-title .kind-icon {
      display: inline-flex; align-items: center; justify-content: center;
      width: 16px; height: 16px;
      color: var(--card-accent, var(--text-3));
      flex-shrink: 0;
    }
    .source-title-text {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    /* ⋯ button sits absolute-positioned in the top-right corner, same
     * affordance pattern as feed-cards. Reserve space in main col so
     * the author chip never collides with it. */
    .source-row > .card-actions {
      position: absolute; top: 8px; right: 10px;
      z-index: 2;
    }
    .source-row .source-main { padding-right: 0; }
    .source-name-row {
      display: flex; align-items: center; gap: 8px; min-width: 0;
    }
    /* Clickable author avatar in the header row — matches the feed-card
     * author-avatar in size and treatment. Hover scales gently. */
    .author-avatar.source-author-trigger {
      width: 22px; height: 22px;
      padding: 0;
      font-size: 11px;
      cursor: pointer;
      flex-shrink: 0;
      transition: transform var(--m-fast) var(--m-ease),
                  box-shadow var(--m-fast) var(--m-ease);
    }
    @media (hover: hover) {
      .author-avatar.source-author-trigger:hover {
        transform: scale(1.1);
        box-shadow: 0 0 0 2px var(--accent-soft);
      }
    }
    /* Footer — single line: events · date range · author · synced.
     * No flex-spacer, no left/right split. Reads as one factual phrase
     * about the source's state. Wraps to 2 lines on narrow widths. */
    .source-foot {
      grid-column: 1 / -1;
      display: flex; align-items: center;
      flex-wrap: wrap;
      gap: 2px 8px;
      color: var(--text-3);
      font-family: var(--f-mono);
      font-size: 11.5px;
      letter-spacing: 0.01em;
      font-variant-numeric: tabular-nums;
    }
    .source-foot-sep { color: var(--text-4); }
    .source-foot-range { color: var(--text-2); }
    /* Author lives in the footer as a quiet inline mete-token —
     * not a full pill. Clickable to change. Mini-avatar (14px) keeps
     * the visual weight down to the rest of the meta line. */
    .source-foot-author {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 1px 6px 1px 4px;
      margin: -2px 0;
      background: transparent;
      border: 1px solid transparent;
      border-radius: var(--r-pill);
      color: var(--text-3);
      font-family: inherit;
      font-size: inherit;
      cursor: pointer;
      transition: background var(--m-fast), border-color var(--m-fast), color var(--m-fast);
    }
    .source-foot-author:hover {
      background: var(--surface-2);
      border-color: var(--border);
      color: var(--text);
    }
    .source-foot-author .author-avatar {
      width: 14px; height: 14px; font-size: 9px;
      border-width: 1px;
    }
    .source-foot-author[data-mine="1"] { color: var(--text-2); }
    .source-foot-sep { color: var(--text-4); opacity: 0.6; }
    .source-foot-range { color: var(--text-3); font-variant-numeric: tabular-nums; }
    .source-foot-spacer { flex: 1; }
    .source-row::before {
      content: ""; position: absolute; left: 0; top: 0; bottom: 0;
      width: 2px;
      background: var(--card-accent, var(--border-2));
      border-top-left-radius: var(--r-md);
      border-bottom-left-radius: var(--r-md);
    }
    @media (hover: hover) {
      .source-row:hover {
        background: var(--surface-2);
        border-color: var(--border-2);
      }
    }
    .source-row[data-active="0"] {
      opacity: 0.6;
    }
    .source-row[data-active="0"]:hover { opacity: 0.85; }

    .source-kind {
      position: relative;
      display: inline-flex; align-items: center; justify-content: center;
      width: 44px; height: 44px;
      color: var(--card-accent, var(--text-3));
      border-radius: var(--r-sm);
      background: color-mix(in oklab, var(--card-accent) 14%, var(--surface-2));
      flex-shrink: 0;
    }

    .source-main {
      display: flex; flex-direction: column;
      gap: 4px;
      min-width: 0;
    }
    .source-name-row {
      display: flex; align-items: center; min-width: 0;
    }
    .source-name-wrap {
      display: inline-flex; align-items: center; gap: 4px;
      min-width: 0;
    }
    .source-name {
      font-family: var(--f-mono);
      font-size: var(--t-15);
      font-weight: var(--w-sb);
      color: var(--text);
      letter-spacing: -0.005em;
      word-break: break-word;
    }
    .source-name-row {
      display: flex; align-items: center; gap: 10px;
      min-width: 0;
    }

    /* Author chip in the source-row meta line — full author-pick
     * trigger (avatar + name + chev). Opens the same popover used in
     * Add Event / Detail view. */
    .source-author-chip {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 3px 8px 3px 3px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--r-pill);
      color: var(--text-2);
      font-size: var(--t-12);
      font-weight: var(--w-md);
      cursor: pointer;
      transition: background var(--m-fast), border-color var(--m-fast), color var(--m-fast);
    }
    .source-author-chip:hover {
      background: var(--surface-3);
      border-color: var(--border-2);
      color: var(--text);
    }
    .source-author-chip .author-avatar {
      width: 20px; height: 20px;
      font-size: 11px;
    }
    .source-author-chip-name {
      color: var(--text);
      letter-spacing: -0.005em;
    }
    .source-author-chip .author-pick-chev {
      display: inline-flex; color: var(--text-3);
      margin-right: 2px;
    }

    /* On/off toggle — classic switch. Accent fill when on. */
    .source-toggle {
      position: relative;
      width: 38px; height: 22px;
      padding: 0;
      background: var(--surface-3);
      border: 1px solid var(--border-2);
      border-radius: 11px;
      cursor: pointer;
      transition: background var(--m-fast), border-color var(--m-fast);
      flex-shrink: 0;
    }
    .source-toggle-thumb {
      position: absolute;
      top: 2px; left: 2px;
      width: 16px; height: 16px;
      border-radius: 50%;
      background: var(--text-3);
      transition: left var(--m-fast) var(--m-ease),
                  background var(--m-fast) var(--m-ease);
    }
    .source-toggle[data-on="1"] {
      background: var(--accent);
      border-color: var(--accent);
    }
    .source-toggle[data-on="1"] .source-toggle-thumb {
      left: 18px;
      background: var(--accent-text);
    }
    .source-toggle:hover {
      border-color: var(--text-3);
    }

    .source-meta {
      display: flex; align-items: center; gap: 8px;
      color: var(--text-3);
      font-size: var(--t-12);
      min-width: 0;
    }
    .source-sep { color: var(--text-4); }
    .source-synced {
      color: var(--text-3);
      font-family: var(--f-mono);
      font-size: 11.5px;
    }

    .source-stats {
      color: var(--text-3);
      font-size: var(--t-12);
      text-align: right;
      font-variant-numeric: tabular-nums;
      flex-shrink: 0;
      padding-right: 6px;
    }
    .source-stats b {
      color: var(--text);
      font-weight: var(--w-sb);
      font-size: var(--t-15);
    }
    .source-stats-label { color: var(--text-3); }

    .source-actions {
      display: inline-flex; align-items: center; gap: 16px;
      flex-shrink: 0;
    }
    /* Big sync button — main action on the row. */
    .btn.source-sync-btn {
      height: 32px; min-height: 32px;
      padding: 0 12px;
      gap: 6px;
      font-size: var(--t-13);
    }
    .btn.source-sync-btn svg {
      transition: transform var(--m-base) var(--m-ease);
    }
    .btn.source-sync-btn:hover svg {
      transform: rotate(-90deg);
    }

    .source-overflow {
      width: 32px; height: 32px;
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-3);
    }
    .source-overflow:hover {
      background: var(--surface-2);
      border-color: var(--border);
      color: var(--text);
    }

    /* Mobile — actions wrap below title on narrow screens. */
    @media (max-width: 560px) {
      .source-row {
        grid-template-columns: 1fr;
        grid-template-areas:
          "title"
          "acts"
          "foot";
        gap: 8px;
      }
      .source-actions { justify-content: flex-start; flex-wrap: wrap; gap: 10px; }
    }
    @media (max-width: 480px) {
      .btn.source-sync-btn span { display: none; }
      .btn.source-sync-btn { padding: 0; width: 32px; justify-content: center; }
    }

    /* Bulk action bar — sticky-bottom centered tray. */
    .bulk-bar {
      position: fixed; bottom: 16px; left: 50%;
      transform: translateX(-50%);
      z-index: 50;
      pointer-events: none;
      max-width: calc(100vw - 32px);
    }
    .bulk-bar-inner {
      display: flex; align-items: center; gap: var(--s-2);
      padding: 8px 8px 8px 18px;
      background: var(--surface);
      border: 1px solid var(--border-2);
      border-radius: var(--r-lg);
      box-shadow: var(--shadow-elev);
      pointer-events: auto;
      flex-wrap: wrap;
    }
    .bulk-count { font-size: var(--t-13); color: var(--text-2); }
    .bulk-count strong {
      color: var(--accent-strong); font-weight: var(--w-sb);
      font-variant-numeric: tabular-nums;
      margin-right: 2px;
    }
    .btn.danger { color: var(--danger); }
    .btn.danger:hover { color: var(--danger); border-color: var(--danger); }
    .inbox-chip {
      background: transparent;
      border-style: dashed;
      color: var(--text-3);
    }
    /* Author tag in footer — subtle text marker, always present so the
     * reader can scan "mine vs others" without a hunt. */
    .author-tag {
      color: var(--text-3); font-size: var(--t-12);
      font-family: var(--f-mono);
      letter-spacing: 0.02em;
    }
    .mine-pill {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 1px 6px;
      background: var(--accent-soft);
      color: var(--accent-strong);
      border-radius: var(--r-xs);
      font-family: var(--f-mono);
      font-size: 10.5px;
      font-weight: var(--w-md);
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .feed-footer {
      grid-column: 1 / -1;
      display: flex; justify-content: center; align-items: center;
      gap: var(--s-3);
      padding: var(--s-7) 0 var(--s-8);
      color: var(--text-3); font-size: var(--t-13);
    }
    .feed-footer::before, .feed-footer::after {
      content: ""; flex: 1; height: 1px; background: var(--border-hairline);
      max-width: 120px;
    }

    /* "Density: compact" tweaks. */
    [data-density="compact"] .card-body { padding: var(--s-2) var(--s-3) var(--s-3); gap: var(--s-1); }
    [data-density="compact"] .card-title { font-size: var(--t-14); }
    [data-density="compact"] .card-notes { display: none; }
    [data-density="compact"] .feed-grid  { gap: var(--s-2); }
    [data-density="compact"] .date-head  { padding: var(--s-5) 0 var(--s-2); }

    /* Vibe variants — override only what's different from the base "Warm diary". */
    [data-vibe="linear"] {
      --bg: #0B0B0E;
      --surface: #131318;
      --surface-2: #1A1A20;
      --surface-3: #21212A;
      --border: #232329;
      --border-2: #2F2F37;
      --text: #ECECEF;
      --text-2: #A4A4AC;
      --text-3: #72727A;
    }
    [data-vibe="linear"] .card { border-radius: var(--r-sm); }
    [data-vibe="linear"] .card-thumb { background: #0F0F14; }

    [data-vibe="stripe"] {
      --bg: #0C0C10;
      --surface: #15151B;
      --surface-2: #1B1B22;
      --border: #25252C;
      --border-2: #313139;
      --text: #F3F3F5;
      --text-2: #ABABB2;
      --text-3: #74747C;
    }
    [data-vibe="stripe"] .card { border-radius: 8px; }
    [data-vibe="stripe"] .card-thumb { aspect-ratio: 21 / 9; }
    [data-vibe="stripe"] .card-title { font-size: var(--t-14); font-weight: var(--w-sb); }

    /* Light mode overrides. */
    [data-theme="light"] .chrome {
      background: color-mix(in oklab, var(--bg) 80%, transparent);
    }
    [data-theme="light"] .card-thumb .play { background: rgba(0,0,0,.7); color:#fff; }

    /* Tweaks-panel collision guard — keep cards visible behind the panel. */
    @media (min-width: 640px) {
      .layout-inner { padding-bottom: 100px; }
    }
  </style>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="app-data.jsx"></script>
  <script type="text/babel" src="add-event-modal.jsx"></script>
  <script type="text/babel" src="event-detail.jsx"></script>
  <script type="text/babel" src="sources-page.jsx"></script>
  <script type="text/babel" src="app.jsx"></script>
</body>
</html>
