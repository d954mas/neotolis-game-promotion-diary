# Production compose template. Lives alongside docker-compose.selfhost.yml
# but is NOT smoke-gated. The selfhost.yml stays the published self-host
# file; this is the author-instance variant.
#
# Differences from selfhost.yml:
#   - image from GHCR (not build:.)
#   - nginx service with HTTPS termination via Cloudflare Origin CA cert
#     (Full Strict mode — see docs/deploy/install.md §2 step 7)
#   - restart: unless-stopped on every service
#   - log driver json-file with rotation
#   - env_file: .env (vs literal inline values)
#   - POSTGRES_PASSWORD via env file
#   - NODE_ENV: production hard-pinned in `environment:` so operator-side
#     .env mistakes don't crash-loop the app on pino-pretty.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: neotolis
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  app:
    image: ghcr.io/d954mas/neotolis-diary:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      APP_ROLE: app
      APP_MODE: selfhost
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/neotolis
      PORT: 3000
    depends_on:
      postgres: { condition: service_healthy }
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  worker:
    image: ghcr.io/d954mas/neotolis-diary:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      APP_ROLE: worker
      APP_MODE: selfhost
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/neotolis
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["NONE"]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  scheduler:
    image: ghcr.io/d954mas/neotolis-diary:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      APP_ROLE: scheduler
      APP_MODE: selfhost
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/neotolis
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["NONE"]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      # Origin only listens on 443 — port 80 is closed (UFW §1 Step 2,
      # nginx.conf.template has no `listen 80`). HTTP→HTTPS redirect is
      # handled by Cloudflare's "Always Use HTTPS" rule at the edge.
      # Strict reading of constraint "plain HTTP only behind a
      # TLS-terminating proxy" — origin never participates in plaintext.
      - "443:443"
    volumes:
      - ./nginx/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./nginx/cf-ips.conf:/etc/nginx/cf-ips.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    environment:
      DOMAIN: ${DOMAIN}
    depends_on:
      - app
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  pg_data: {}
