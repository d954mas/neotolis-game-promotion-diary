apiVersion: 1

groups:
  - orgId: 1
    name: neotolis-alerts
    folder: Neotolis
    interval: 1m
    rules:
      - uid: error-rate-spike
        title: "Error Rate Spike (>5% 5xx in 5min)"
        condition: A
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: >-
                (sum(rate(neotolis_http_requests_total{status_code=~"5.."}[5m])) or vector(0))
                /
                (clamp_min(sum(rate(neotolis_http_requests_total[5m])), 1))
                > 0.05
              instant: false
              intervalMs: 15000
              refId: A
        for: 5m
        noDataState: OK
        execErrState: OK
        annotations:
          summary: "5xx error rate exceeds 5% over the last 5 minutes"
        labels:
          severity: critical

      - uid: high-latency-p95
        title: "High Latency (p95 > 2s for 5min)"
        condition: A
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: histogram_quantile(0.95, sum(rate(neotolis_http_request_duration_seconds_bucket[5m])) by (le)) > 2
              instant: false
              intervalMs: 15000
              refId: A
        for: 5m
        noDataState: OK
        execErrState: OK
        annotations:
          summary: "p95 request latency exceeds 2 seconds for 5 minutes"
        labels:
          severity: warning

      - uid: memory-pressure
        title: "Memory Pressure (RSS > 400MB)"
        condition: A
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: neotolis_process_resident_memory_bytes > 400000000
              instant: false
              intervalMs: 15000
              refId: A
        for: 5m
        noDataState: OK
        execErrState: OK
        annotations:
          summary: "Node.js RSS memory exceeds 400MB (tune threshold in Grafana UI if your container limit differs)"
        labels:
          severity: warning

      - uid: scrape-target-down
        title: "Scrape Target Down (up == 0)"
        # Two-stage (mirrors escaped-error-logs): A = the raw `up` gauge,
        # B = explicit threshold "up < 1". The OLD form used `up == 0` as a
        # bare condition with noDataState: Alerting — when the app was healthy
        # (up=1) the `== 0` filter returned EMPTY, Grafana read that as NoData,
        # and noDataState: Alerting FIRED a critical alert on a HEALTHY app
        # (false-positive that fired continuously for ~22h). Explicit threshold
        # removes the implicit reduce-of-a-bare-comparison ambiguity:
        #   up=1                → 1, not < 1 → Normal (silent)
        #   up=0 (scrape fails, target present) → 0 < 1 → fires after for:2m
        #   no `up` sample at all (Prometheus blind) → NoData → OK
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: up{job="neotolis-app"}
              instant: true
              intervalMs: 15000
              refId: A
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              conditions:
                - evaluator:
                    type: lt
                    params: [1]
              refId: B
        for: 2m
        noDataState: OK
        execErrState: OK
        annotations:
          summary: "Prometheus cannot scrape the app — container may be down or /metrics unreachable"
        labels:
          severity: critical

      - uid: escaped-error-logs
        title: "Escaped Error Logs (errors bypassing Pino)"
        # Loki-backed. Fires when a plain-text error pattern that bypassed
        # structured logging appears. The selector excludes JSON lines
        # (`!= "level":` skips Pino + nginx access), so a hit means a raw
        # Node crash / framework stack trace was emitted outside Pino. The
        # regex is deliberately narrow (uncaughtException / unhandledRejection
        # / ERR_ codes) so routine nginx error_log noise does not page.
        # Two-stage: A = Loki count, B = threshold expression (Grafana's
        # __expr__ engine), condition = B.
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: loki
            model:
              datasource:
                type: loki
                uid: loki
              expr: 'sum(count_over_time({service=~"app|worker|scheduler"} != `"level":` |~ `(?i)(uncaughtException|unhandledRejection|ERR_[A-Z0-9_]+)` [5m]))'
              queryType: instant
              intervalMs: 15000
              refId: A
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
              refId: B
        for: 0m
        noDataState: OK
        execErrState: OK
        annotations:
          summary: "A non-structured error log appeared — something logged outside Pino (raw Node crash or framework stack trace). Check the Escaped Errors panel on the Neotolis Logs dashboard."
        labels:
          severity: warning
